<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>run-stack</title>
<style>
  :root {
    color-scheme: light dark;
    --bg: #f6f6f4; --card: #fff; --text: #1c1c1a; --muted: #6f6f6a; --line: #e3e3de;
    --ok: #1f8a4c; --warn: #b36b00; --off: #9a9a94; --accent: #2456d6;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #151514; --card: #1e1e1c; --text: #ecece8; --muted: #9a9a94; --line: #30302d; --ok: #4cc27d; --warn: #e0a040; --off: #6f6f6a; --accent: #8fb0ff; }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text); font: 15px/1.45 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
  main { max-width: 920px; margin: 0 auto; padding: 32px 20px 64px; }
  header { display: flex; align-items: baseline; justify-content: space-between; margin-bottom: 20px; }
  h1 { font-size: 20px; margin: 0; }
  .muted { color: var(--muted); }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 10px; padding: 16px 18px; margin-bottom: 14px; }
  .card.stopped { opacity: .72; }
  .top { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
  .name { font-weight: 600; font-size: 16px; }
  .pill { font-size: 12px; padding: 1px 8px; border-radius: 99px; border: 1px solid currentColor; }
  .running .pill { color: var(--ok); } .orphaned .pill { color: var(--warn); } .stopped .pill { color: var(--off); }
  .spacer { flex: 1; }
  button { font: inherit; font-size: 13px; padding: 4px 12px; border-radius: 6px; border: 1px solid var(--line); background: transparent; color: var(--text); cursor: pointer; }
  button:hover { border-color: var(--muted); }
  button:disabled { opacity: .5; cursor: default; }
  .dir { font-size: 13px; margin: 2px 0 12px; word-break: break-all; }
  table { width: 100%; border-collapse: collapse; }
  td { padding: 5px 0; border-top: 1px solid var(--line); vertical-align: top; }
  td.dot { width: 18px; } td.port { width: 220px; padding-right: 12px; }
  .mono { font: 13px ui-monospace, SFMono-Regular, Menlo, monospace; }
  .dot i { display: inline-block; width: 8px; height: 8px; border-radius: 50%; background: var(--off); }
  .dot i.on { background: var(--ok); } .dot i.warn { background: var(--warn); }
  a { color: var(--accent); text-decoration: none; } a:hover { text-decoration: underline; }
  .warn-text { color: var(--warn); }
  pre { margin: 12px 0 0; padding: 12px; max-height: 360px; overflow: auto; background: var(--bg); border: 1px solid var(--line); border-radius: 8px; font: 12px/1.5 ui-monospace, SFMono-Regular, Menlo, monospace; white-space: pre-wrap; word-break: break-word; }
  .empty { text-align: center; padding: 48px 0; }
</style>
</head>
<body>
<main>
  <header><h1>run-stack</h1><span class="muted" id="summary"></span></header>
  <div id="stacks"></div>
</main>
<script>
const openLogs = new Set();
const busy = new Set();
const root = document.getElementById("stacks");
let last = [];

function element(tag, props = {}, ...children) {
  const node = Object.assign(document.createElement(tag), props);
  node.append(...children);
  return node;
}

async function act(action, id) {
  busy.add(id);
  render(last);
  await fetch(`/api/${action}?id=${encodeURIComponent(id)}`, { method: "POST" });
  setTimeout(() => { busy.delete(id); refresh(); }, 1500);
}

async function loadLogs(id, pre) {
  const response = await fetch(`/api/logs?id=${encodeURIComponent(id)}`);
  const text = response.ok ? await response.text() : "No log yet.";
  const pinned = !pre.textContent || pre.scrollTop + pre.clientHeight >= pre.scrollHeight - 20;
  pre.textContent = text.replace(/\x1b\[[0-9;]*[A-Za-z]/g, "");
  if (pinned) pre.scrollTop = pre.scrollHeight;
}

function render(stacks) {
  last = stacks;
  const live = stacks.filter((stack) => stack.status !== "stopped").length;
  document.getElementById("summary").textContent = stacks.length ? `${live} running, ${stacks.length - live} stopped` : "";

  if (!stacks.length) {
    root.replaceChildren(element("div", { className: "empty muted" }, "No stacks yet. Run “run-stack up” in a checkout."));
    return;
  }

  const kept = new Map([...root.querySelectorAll("pre")].map((pre) => [pre.dataset.id, pre]));

  root.replaceChildren(...stacks.map((stack) => {
    const up = stack.status !== "stopped";
    const rows = stack.ports.map((port) => element("tr", {},
      element("td", { className: "dot" }, element("i", { className: !port.declared ? "warn" : port.listening ? "on" : "", title: port.listening ? "listening" : "not listening" })),
      element("td", { className: "port mono" + (port.declared ? "" : " warn-text") }, port.declared ? port.name : `undeclared${port.command ? ` (${port.command})` : ""}`),
      element("td", { className: "mono" }, port.url ? element("a", { href: port.url, target: "_blank" }, port.url) : "", port.url ? "  " : "", element("span", { className: "muted" }, `localhost:${port.port}`)),
    ));

    const card = element("div", { className: `card ${stack.status}` },
      element("div", { className: "top" },
        element("span", { className: "name" }, stack.id),
        element("span", { className: "pill" }, stack.status),
        element("span", { className: "spacer" }),
        element("button", { onclick: () => { openLogs.has(stack.id) ? openLogs.delete(stack.id) : openLogs.add(stack.id); render(last); } }, openLogs.has(stack.id) ? "Hide logs" : "Logs"),
        element("button", { disabled: busy.has(stack.id) || (!up && stack.folderMissing), onclick: () => act(up ? "stop" : "start", stack.id) }, busy.has(stack.id) ? "…" : up ? "Stop" : "Start"),
      ),
      element("div", { className: "dir muted mono" }, stack.dir + (stack.folderMissing ? "  (folder deleted)" : "")),
      element("table", {}, ...rows),
    );

    if (openLogs.has(stack.id)) {
      const pre = kept.get(stack.id) ?? element("pre");
      pre.dataset.id = stack.id;
      card.append(pre);
      loadLogs(stack.id, pre);
    }

    return card;
  }));
}

async function refresh() {
  try {
    render(await (await fetch("/api/stacks")).json());
  } catch {
    document.getElementById("summary").textContent = "proxy not reachable";
  }
}

refresh();
setInterval(refresh, 2500);
</script>
</body>
</html>
